name: MCP source tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --prefix tools/mcp --ignore-scripts
      - run: node --test tools/mcp/server.test.mjs
      - run: docker build -t paritydiff-mcp-source .
